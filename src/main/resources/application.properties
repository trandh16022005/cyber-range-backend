# ==========================================
# APPLICATION
# ==========================================

spring.application.name=cyber-range-backend
server.port=${SERVER_PORT:8080}


# ==========================================
# DATABASE - POSTGRESQL
# ==========================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cyber_range_db}
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# JWT CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.issuer=${JWT_ISSUER:cyber-range-backend}


# ==========================================
# CORS CONFIGURATION
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
